// ★ 全角英字 → 半角英字へ変換する関数
function toHalfWidth(str) {
  return str.replace(/[Ａ-Ｚａ-ｚ]/g, s =>
    String.fromCharCode(s.charCodeAt(0) - 0xFEE0)
  );
}

// ★ ローカルストレージキー
const LS_KEY = "memorizedFlags";

// ★ ローカルストレージから読み込み
function loadFromLocalStorage() {
  const saved = localStorage.getItem(LS_KEY);

  // 保存データが無い → 新規作成（全 false）
  if (!saved) {
    for (let i = 0; i < database.length; i++) {
      database[i][6] = false;
    }
    saveToLocalStorage();
    return;
  }

  let savedArray;
  try {
    savedArray = JSON.parse(saved);
  } catch {
    // 壊れたデータ → 全 false にして保存
    alert("保存データが破損していたためリセットします。");
    for (let i = 0; i < database.length; i++) {
      database[i][6] = false;
    }
    saveToLocalStorage();
    return;
  }

  // ★ 配列数が違う場合（問題数が増えた場合）
  if (!Array.isArray(savedArray) || savedArray.length !== database.length) {

    alert("問題数が増えたため暗記状態をリセットします。");

    // 全 false にリセット
    for (let i = 0; i < database.length; i++) {
      database[i][6] = false;
    }
    saveToLocalStorage();
    return;
  }

  // ★ 配列数が同じ → ローカルストレージを反映
  for (let i = 0; i < database.length; i++) {
    database[i][6] = savedArray[i];
  }
}


// ★ ローカルストレージへ保存
function saveToLocalStorage() {
  const flags = database.map(row => row[6]);
  localStorage.setItem(LS_KEY, JSON.stringify(flags));
}

document.addEventListener("DOMContentLoaded", () => {

  loadFromLocalStorage();

  let currentIndex = 0;

let canGiveup = true;  // ★ ギブアップ可能フラグ
const solutionBox= document.querySelector(".solution-box");

// ★ 起動時にランダムな未暗記問題を選ぶ
const unsolved = database
  .map((row, index) => ({ solved: row[6], index }))
  .filter(item => !item.solved)
  .map(item => item.index);

// 未暗記がある場合 → ランダムに選ぶ
if (unsolved.length > 0) {
  currentIndex = unsolved[Math.floor(Math.random() * unsolved.length)];
} else {
  // 全問暗記済みならリセットしてランダム
  alert("全問記憶したのでリセットします。");
  for (let i = 0; i < database.length; i++) {
    database[i][6] = false;
  }
  saveToLocalStorage();
  currentIndex = Math.floor(Math.random() * database.length);
}

const sectionTitle = document.querySelector(".question-box");
sectionTitle.textContent = database[currentIndex][0];

  document.querySelectorAll(".hint-show").forEach(btn => {
    btn.addEventListener("click", () => {
      const targetId = btn.dataset.target;
      const contentBox = document.getElementById(targetId);

      if (targetId === "hint1") {
        contentBox.textContent = database[currentIndex][1];
      } else if (targetId === "hint2") {
        contentBox.textContent = database[currentIndex][2];
      } else if (targetId === "point") {
        contentBox.textContent = database[currentIndex][3];
      }

      contentBox.style.display = "block";
    });
  });

  const input = document.querySelector(".answer-input input");

  input.addEventListener("input", () => {
    if (input.value.length > 3) {
      input.value = input.value.slice(0, 3);
    }
  });

  const checkBtn = document.querySelector(".button-row button:nth-child(1)");
  const nextBtn  = document.querySelector(".button-row button:nth-child(2)");
  const chkbox = document.querySelector(".answer-chkbox");
  const chkboxInput = document.querySelector(".answer-chkbox input");

  chkboxInput.addEventListener("change", () => {
    database[currentIndex][6] = chkboxInput.checked;
    saveToLocalStorage();
  });

  // ★ 答え合わせ
  checkBtn.addEventListener("click", () => {
    let userAnswer = input.value.trim();
    userAnswer = toHalfWidth(userAnswer).toLowerCase();

    const correctAnswer = database[currentIndex][4].toLowerCase();
   if (userAnswer === correctAnswer) {
       solutionBox.innerHTML =
    '<span style="color: blue;">正解</span><br>' +
    '<span style="color: black;">' + database[currentIndex][5] + '</span>';
      chkbox.style.visibility = "visible";
    } else {
      solutionBox.innerHTML =  '<span style="color: red;">不正解</span><br>' +
    '<span style="color: black;">' + database[currentIndex][5] + '</span>';
    }
 // ★ ヒントを表示する
  document.getElementById("hint1").textContent = database[currentIndex][1];
  document.getElementById("hint2").textContent = database[currentIndex][2];
  document.getElementById("point").textContent = database[currentIndex][3];

  document.getElementById("hint1").style.display = "block";
  document.getElementById("hint2").style.display = "block";
  document.getElementById("point").style.display = "block";

    // ★ input を入力不可にする
  input.disabled = true;
    // ★ ギブアップを無効化
  canGiveup = false;
  });

  // ★ 暗記済みを除外してランダムに次の問題を選ぶ
 function findNextUnsolved(prevIndex) {

  // ★ 未暗記がゼロなら全リセット（←ここに追加）
  const unsolvedCheck = database.filter(row => !row[6]);
  if (unsolvedCheck.length === 0) {
     alert("全問記憶したのでリセットします。");
    for (let i = 0; i < database.length; i++) {
      database[i][6] = false;
    }
    saveToLocalStorage();
    return Math.floor(Math.random() * database.length);
  }

  // ★ 未暗記の問題だけ抽出（ここは元のまま）
  const unsolved = database
    .map((row, index) => ({ solved: row[6], index }))
    .filter(item => !item.solved)
    .map(item => item.index);

  // 直前の問題を除外
  const candidates = unsolved.filter(idx => idx !== prevIndex);

  const list = candidates.length > 0 ? candidates : unsolved;

  const r = Math.floor(Math.random() * list.length);
  return list[r];
}


  // ★ 次の問題
  nextBtn.addEventListener("click", () => {

    chkbox.style.visibility = "hidden";
    const nextIndex = findNextUnsolved(currentIndex);
    currentIndex = nextIndex;

    sectionTitle.textContent = database[currentIndex][0];
    
    document.querySelector(".solution-box").textContent = "";
    
    document.getElementById("hint1").style.display = "none";
    document.getElementById("hint2").style.display = "none";
    document.getElementById("point").style.display = "none";
 
    document.getElementById("hint1").textContent = "";
    document.getElementById("hint2").textContent = "";
    document.getElementById("point").textContent = "";
     
    chkboxInput.checked = database[currentIndex][6];
    chkbox.style.visibility = database[currentIndex][6] ? "visible" : "hidden";

    input.value = "";

    // ★ input を再び入力可能にする
  input.disabled = false;
// ★ ギブアップを再び有効化
  canGiveup = true;
  });

  // ★ ギブアップ
  const giveupBtn = document.querySelector(".button-row button:nth-child(3)");
  giveupBtn.addEventListener("click", () => {

      // ★ 答え合わせ後はギブアップ無効
    if (!canGiveup) return;
    
    const questionBox = document.querySelector(".question-box");
    solutionBox.innerHTML = database[currentIndex][5];

    document.getElementById("hint1").textContent = database[currentIndex][1];
    document.getElementById("hint2").textContent = database[currentIndex][2];
    document.getElementById("point").textContent = database[currentIndex][3];

    document.getElementById("hint1").style.display = "block";
    document.getElementById("hint2").style.display = "block";
    document.getElementById("point").style.display = "block";
  });

  const endBtn = document.querySelector(".button-row button:nth-child(4)");
  endBtn.addEventListener("click", () => {
    saveToLocalStorage();
    window.close();
  });
});
</script>
